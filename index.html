<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMVS Digital</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f4f5f7; }
    /* depois */
    iframe {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100vh;    /* fallback */
      height: 100dvh;   /* acompanha a barra do navegador */
      border: none; display: block;
    }
  </style>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <iframe
    id="appFrame"
    allow="geolocation; camera; microphone"
    allowfullscreen>
  </iframe>

  <script>
    const baseUrlAppsScript = "https://script.google.com/macros/s/AKfycbxBTCIRi8IjBt92IPFFAXG4HTcX5c9GF0eJjgfyry5ehA9tDgvscJelmk3ktfkHWuvJ/exec";

    // ── Estado do Fiscal ──────────────────────────────
    let currentFiscal = null;
    try {
      const salvo = localStorage.getItem('amvs_fiscal_push');
      if (salvo) currentFiscal = JSON.parse(salvo);
    } catch(e) {}

    // ── Resposta de Status ao Iframe ──────────────────
    function enviarStatusPushAoIframe(statusForcado) {
      const iframe = document.getElementById('appFrame');
      if (!iframe || !iframe.contentWindow) return;

      let permission = 'default';
      let optedIn = false;
      let playerId = null;

      if (typeof Notification !== 'undefined') {
        permission = Notification.permission;
      }
      if (window.OneSignal && OneSignal.User && OneSignal.User.PushSubscription) {
        optedIn = !!OneSignal.User.PushSubscription.optedIn;
        playerId = OneSignal.User.PushSubscription.id || null;
      }

      let status = statusForcado;
      if (!status) {
        if (permission === 'denied') {
          status = 'bloqueado_navegador';
        } else if (optedIn && playerId) {
          status = 'ativo';
        } else if (permission === 'granted') {
          status = 'permitido_nao_inscrito';
        } else {
          status = 'pendente';
        }
      }

      iframe.contentWindow.postMessage({
        sistema: 'AMVS_DIGITAL',
        acao: 'RESPOSTA_STATUS_PUSH',
        status: status,
        permission: permission,
        optedIn: optedIn,
        playerId: playerId,
        fiscal: currentFiscal
      }, '*');
    }

    // ── Salva Player ID no GAS ────────────────────────
    async function enviarPlayerIdAoGAS(playerId, optedIn, fiscal) {
      if (!playerId) return;
      const f = fiscal || currentFiscal || {};
      try {
        await fetch(baseUrlAppsScript, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            acao: "salvarPlayerId",
            playerId: playerId,
            optedIn: optedIn !== false,
            usuarioId: f.id || "",
            usuarioNome: f.nome || "",
            usuarioCpf: f.cpf || ""
          })
        });
      } catch (err) {
        console.warn("[OneSignal] Erro ao enviar Player ID ao GAS:", err);
      }
    }

    // ── OneSignal Inicialização ───────────────────────
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "d0db32c7-befc-419e-a2f2-0c2e1ca73959",
        promptOptions: {
          slidedown: {
            prompts: [{
              type: "push",
              autoPrompt: true,
              text: {
                actionMessage: "Receba notificações sobre suas atividades e demandas do AMVS Digital.",
                acceptButton: "Permitir",
                cancelButton: "Agora não"
              }
            }]
          }
        }
      });

      // Se já temos o fiscal em cache, reaplica identificação
      if (currentFiscal && currentFiscal.id) {
        try {
          OneSignal.login(currentFiscal.id);
          OneSignal.User.addTag("fiscal_id", currentFiscal.id);
          OneSignal.User.addTag("fiscal_nome", currentFiscal.nome);
        } catch(e) {}
      }

      // Já estava inscrito de sessão anterior
      const playerIdAtual = OneSignal.User.PushSubscription.id;
      const optedInAtual = !!OneSignal.User.PushSubscription.optedIn;
      if (playerIdAtual && optedInAtual) {
        enviarPlayerIdAoGAS(playerIdAtual, true);
      }

      // Notifica o iframe se ele já estiver pronto
      enviarStatusPushAoIframe();

      // Monitora alterações na inscrição
      OneSignal.User.PushSubscription.addEventListener("change", function(e) {
        const id = e.current.id;
        const opt = !!e.current.optedIn;
        if (id) {
          enviarPlayerIdAoGAS(id, opt);
        }
        enviarStatusPushAoIframe(opt ? 'ativo' : undefined);
      });
    });

    // ── Listener de mensagens do GAS (Iframe) ────────
    window.addEventListener('message', function(event) {
      if (!event.data || event.data.sistema !== 'AMVS_DIGITAL') return;

      // 1. Mudança de rota amigável
      if (event.data.acao === 'MUDAR_URL') {
        const novoCaminho = '/' + event.data.caminho;
        if (window.location.pathname !== novoCaminho) {
          window.history.pushState(null, null, novoCaminho);
        }
      }

      // 2. Vinculação do fiscal logado
      if (event.data.acao === 'VINCULAR_USUARIO_PUSH') {
        const u = event.data.usuario;
        if (u && u.id) {
          currentFiscal = { id: String(u.id), nome: String(u.nome || ''), cpf: String(u.cpf || '') };
          try {
            localStorage.setItem('amvs_fiscal_push', JSON.stringify(currentFiscal));
          } catch(e) {}

          if (window.OneSignal && OneSignal.User) {
            try {
              OneSignal.login(currentFiscal.id);
              OneSignal.User.addTag("fiscal_id", currentFiscal.id);
              OneSignal.User.addTag("fiscal_nome", currentFiscal.nome);
              OneSignal.User.addTag("fiscal_cpf", currentFiscal.cpf);
            } catch(eLogin) {
              console.warn("[OneSignal] Erro ao associar tags do fiscal:", eLogin);
            }

            const pid = OneSignal.User.PushSubscription.id;
            const opt = !!OneSignal.User.PushSubscription.optedIn;
            if (pid) {
              enviarPlayerIdAoGAS(pid, opt, currentFiscal);
            }
          }
          enviarStatusPushAoIframe();
        }
      }

      // 3. Consulta de status
      if (event.data.acao === 'CONSULTAR_STATUS_PUSH') {
        enviarStatusPushAoIframe();
      }

      // 4. Solicitação de ativação pelo fiscal
      if (event.data.acao === 'SOLICITAR_ATIVAR_PUSH') {
        if (typeof Notification !== 'undefined' && Notification.permission === 'denied') {
          enviarStatusPushAoIframe('bloqueado_navegador');
          return;
        }
        if (window.OneSignal && OneSignal.User) {
          try {
            OneSignal.User.PushSubscription.optIn();
          } catch(eOpt) {
            try {
              OneSignal.Slidedown.promptPush();
            } catch(eSl) {
              console.warn("[OneSignal] Erro no prompt de push:", eSl);
            }
          }
        }
      }

      // 5. Logout do usuário
      if (event.data.acao === 'LOGOUT_USUARIO_PUSH') {
        currentFiscal = null;
        try { localStorage.removeItem('amvs_fiscal_push'); } catch(e) {}
        if (window.OneSignal) {
          try { OneSignal.logout(); } catch(e) {}
        }
        enviarStatusPushAoIframe();
      }
    });

    // ── Carregamento do iframe ────────────────────────
    window.onload = function() {
      let path = "";
      let search = window.location.search || "";
      let redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;

      if (redirect && redirect !== location.href) {
        window.history.replaceState(null, null, redirect);
        try {
          const urlObj = new URL(redirect);
          path = urlObj.pathname.substring(1).replace(/\/$/, "");
          if (!search && urlObj.search) search = urlObj.search;
        } catch (e) {}
      } else {
        path = window.location.pathname.substring(1).replace(/\/$/, "");
      }

      const iframe = document.getElementById('appFrame');
      let finalUrl = baseUrlAppsScript;
      const params = new URLSearchParams(search);
      if (path && !params.has('page')) {
        params.set('page', path);
      }
      const qs = params.toString();
      if (qs) {
        finalUrl += (finalUrl.includes('?') ? '&' : '?') + qs;
      }
      iframe.src = finalUrl;
    };
  </script>
</body>
</html>
