<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leitor de Código de Barras - AMVS Digital</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%; background: #0a0e1a; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; user-select: none;
    }
    
    /* CABEÇALHO SUPERIOR */
    .scanner-header {
      position: fixed; top: 0; left: 0; right: 0; height: 50px;
      background: rgba(10, 14, 26, 0.96); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .scanner-header-title {
      font-size: 0.95rem; font-weight: 700; color: #e8eaf6; display: flex; align-items: center; gap: 8px;
    }
    
    /* ÁREA DA CÂMERA */
    #reader-container {
      position: fixed; top: 50px; bottom: 230px; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center; background: #000;
    }
    #reader {
      width: 100% !important; height: 100% !important; border: none !important;
    }
    #reader video {
      object-fit: cover !important; width: 100% !important; height: 100% !important;
    }

    /* MIRA / RETÍCULO LASER */
    .reticulo-overlay {
      position: absolute; width: 85%; max-width: 380px; height: 160px;
      border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 12px;
      pointer-events: none; z-index: 50; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      display: flex; flex-direction: column; justify-content: space-between; padding: 6px;
    }
    .reticulo-canto-tl { width: 20px; height: 20px; border-top: 4px solid #00e676; border-left: 4px solid #00e676; border-radius: 4px 0 0 0; }
    .reticulo-canto-tr { width: 20px; height: 20px; border-top: 4px solid #00e676; border-right: 4px solid #00e676; border-radius: 0 4px 0 0; align-self: flex-end; }
    .reticulo-canto-bl { width: 20px; height: 20px; border-bottom: 4px solid #00e676; border-left: 4px solid #00e676; border-radius: 0 0 0 4px; }
    .reticulo-canto-br { width: 20px; height: 20px; border-bottom: 4px solid #00e676; border-right: 4px solid #00e676; border-radius: 0 0 4px 0; align-self: flex-end; }
    
    .linha-laser {
      position: absolute; top: 10%; left: 5%; width: 90%; height: 2px;
      background: linear-gradient(90deg, transparent, #00e676, transparent);
      box-shadow: 0 0 10px #00e676;
      animation: laserScan 1.6s infinite ease-in-out;
    }
    @keyframes laserScan {
      0%, 100% { top: 10%; opacity: 0.3; }
      50% { top: 90%; opacity: 1; }
    }

    /* PAINEL INFERIOR: CARRINHO DE ITENS ESCANEADOS */
    .scanner-drawer {
      position: fixed; bottom: 0; left: 0; right: 0; height: 230px;
      background: #141b2d; border-top: 2px solid #00e676;
      z-index: 100; display: flex; flex-direction: column; box-shadow: 0 -4px 16px rgba(0,0,0,0.5);
    }
    .scanner-drawer-header {
      padding: 8px 14px; background: #1a233a; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 0.85rem; font-weight: 700; color: #b0bec5;
    }
    .scanner-drawer-list {
      flex: 1; overflow-y: auto; padding: 6px 12px;
    }
    .scanned-item-row {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.08); padding: 8px 10px; border-radius: 6px;
      margin-bottom: 6px; font-size: 0.84rem; border-left: 4px solid #00e676;
    }
    .scanned-item-info {
      flex: 1; overflow: hidden; padding-right: 8px;
    }
    .scanned-item-name {
      font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .scanned-item-sub {
      font-size: 0.72rem; color: #90a4ae; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .scanned-item-ctrls {
      display: flex; align-items: center; gap: 4px;
    }
    .btn-qty {
      width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 4px;
      background: #2a3b5c; color: #fff; cursor: pointer; font-weight: bold; border: none; font-size: 1rem;
    }
    .btn-qty:active { background: #394f7c; }
    .item-qty-val {
      min-width: 26px; text-align: center; font-weight: 700; color: #00e676; font-size: 0.95rem;
    }
    
    /* BARRA DE AÇÃO FINAL */
    .scanner-bottom-bar {
      padding: 8px 12px; background: #0e1424; display: flex; gap: 8px; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .scanner-flash-success {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 230, 118, 0.28); pointer-events: none; z-index: 60;
      opacity: 0; transition: opacity 0.15s ease-out;
    }
  </style>
</head>
<body>

  <!-- FLASH VISUAL VERDE AO ESCANEAR -->
  <div id="flashOverlay" class="scanner-flash-success"></div>

  <!-- CABEÇALHO -->
  <div class="scanner-header">
    <div class="scanner-header-title">
      <i class="material-icons" style="color: #00e676; font-size: 1.3rem;">qr_code_scanner</i>
      <span>Leitor AMVS Digital</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <button id="btnTorch" onclick="alternarLanterna()" class="btn-floating btn-small grey darken-3 waves-effect" title="Lanterna">
        <i class="material-icons" id="iconTorch" style="font-size: 1.1rem;">flash_on</i>
      </button>
      <button onclick="concluirEFechar()" class="btn-floating btn-small red darken-3 waves-effect" title="Fechar">
        <i class="material-icons" style="font-size: 1.1rem;">close</i>
      </button>
    </div>
  </div>

  <!-- ÁREA DE VÍDEO DO SCANNER -->
  <div id="reader-container">
    <div id="reader"></div>
    <div class="reticulo-overlay">
      <div style="display: flex; justify-content: space-between; width: 100%;">
        <div class="reticulo-canto-tl"></div>
        <div class="reticulo-canto-tr"></div>
      </div>
      <div class="linha-laser"></div>
      <div style="display: flex; justify-content: space-between; width: 100%;">
        <div class="reticulo-canto-bl"></div>
        <div class="reticulo-canto-br"></div>
      </div>
    </div>
  </div>

  <!-- PAINEL INFERIOR: LISTA DE PRODUTOS APREENDIDOS -->
  <div class="scanner-drawer">
    <div class="scanner-drawer-header">
      <span id="lblTituloLista"><i class="material-icons tiny left" style="vertical-align: middle;">shopping_cart</i>0 produto(s) apreendido(s)</span>
      <span id="lblBaseCmedStatus" style="font-size: 0.72rem; color: #4db6ac; font-weight: normal;">CMED Carregada</span>
    </div>

    <div class="scanner-drawer-list" id="listaItensScaneados">
      <div id="msgListaVazia" style="text-align: center; color: #78909c; font-style: italic; padding: 22px 0; font-size: 0.84rem;">
        Aponte a câmera para os códigos de barra dos medicamentos apreendidos...
      </div>
    </div>

    <!-- BOTÕES DE AÇÃO INFERIORES -->
    <div class="scanner-bottom-bar">
      <button type="button" onclick="concluirEFechar()" class="btn waves-effect waves-light green darken-2 w100" style="width: 100%; height: 46px; line-height: 46px; font-weight: 700; font-size: 0.95rem; border-radius: 6px; text-transform: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <i class="material-icons">check_circle</i>
        <span id="btnConcluirTexto">CONCLUIR E ADICIONAR AO AUTO</span>
      </button>
    </div>
  </div>

  <script>
    // ─── ÁUDIO ROBUSTO (WEBAUDIO NATIVO + VIBRAÇÃO) ───
    var audioCtx = null;
    var audioLiberado = false;

    function destravarAudio() {
      if (audioLiberado) return;
      try {
        var AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxClass) {
          if (!audioCtx) audioCtx = new AudioCtxClass();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          audioLiberado = true;
        }
      } catch(e) {}
    }
    document.addEventListener('touchstart', destravarAudio, { passive: true });
    document.addEventListener('click', destravarAudio);

    function emitirBeepSucesso() {
      // 1. Áudio WebAudio com tratamento de parâmetros estrito
      try {
        var AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxClass) {
          if (!audioCtx) audioCtx = new AudioCtxClass();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          var t = audioCtx.currentTime;
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1400, t);
          gain.gain.setValueAtTime(0.5, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(0);
          osc.stop(t + 0.14);
        }
      } catch(eAudio) {
        console.warn('[Beep]', eAudio);
      }

      // 2. Vibração física no aparelho
      try {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      } catch(eVib) {}

      // 3. Flash visual verde na tela
      try {
        var fl = document.getElementById('flashOverlay');
        if (fl) {
          fl.style.opacity = '1';
          setTimeout(function() { fl.style.opacity = '0'; }, 180);
        }
      } catch(eFl) {}
    }

    // ─── BASE CMED EM MEMÓRIA LOCAL (BUSCA EM 0 MILISSEGUNDOS) ───
    var BASE_CMED = {};
    var ITENS_ESCANEADOS = [];
    var ultimoCodigo = '';
    var debounceTimer = null;
    var html5QrCode = null;
    var torchAtivo = false;

    function carregarBaseCmedLocal() {
      var elStatus = document.getElementById('lblBaseCmedStatus');
      fetch('cmed_base.json?v=' + new Date().getTime())
        .then(function(res) {
          if (!res.ok) throw new Error('Status ' + res.status);
          return res.json();
        })
        .then(function(data) {
          BASE_CMED = data || {};
          var total = Object.keys(BASE_CMED).length;
          if (elStatus) elStatus.innerText = 'CMED: ' + total.toLocaleString('pt-BR') + ' remédios';
        })
        .catch(function(err) {
          console.warn('[carregarBaseCmedLocal] Aviso:', err);
          if (elStatus) elStatus.innerText = 'CMED Online';
        });
    }

    // ─── PROCESSAMENTO DO CÓDIGO DETECTADO ───
    function aoDetectarCodigo(decodedText) {
      try {
        var ean = String(decodedText || '').trim();
        if (!ean) return;

        // Evita leitura repetida em menos de 1.3s
        if (ean === ultimoCodigo) return;
        ultimoCodigo = ean;
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function() { ultimoCodigo = ''; }, 1300);

        // Beep seguro
        emitirBeepSucesso();

        // Busca dados no CMED ou gera fallback
        var prodInfo = BASE_CMED ? BASE_CMED[ean] : null;
        var nomeProd = prodInfo ? (prodInfo.p || prodInfo.prod || 'Medicamento') : ('Medicamento ' + ean);
        var marca = prodInfo ? (prodInfo.m || prodInfo.lab || '---') : '---';
        var apres = prodInfo ? (prodInfo.a || prodInfo.apres || '') : '';
        var reg = prodInfo ? (prodInfo.r || prodInfo.reg || '') : '';
        var subst = prodInfo ? (prodInfo.s || prodInfo.subst || '') : '';

        // Procura se já está na lista acumulada
        var itemExistente = null;
        for (var i = 0; i < ITENS_ESCANEADOS.length; i++) {
          if (ITENS_ESCANEADOS[i].ean === ean) {
            itemExistente = ITENS_ESCANEADOS[i];
            break;
          }
        }

        if (itemExistente) {
          itemExistente.quantidadeNumero = (itemExistente.quantidadeNumero || 1) + 1;
          itemExistente.quantidade = itemExistente.quantidadeNumero + ' un';
        } else {
          ITENS_ESCANEADOS.push({
            id: new Date().getTime() + Math.floor(Math.random() * 1000),
            ean: ean,
            produto: nomeProd,
            marca: marca,
            volume: apres,
            registro: reg,
            substancia: subst,
            quantidadeNumero: 1,
            quantidade: '1 un',
            motivo: 'Comércio irregular'
          });
        }

        // Renderiza no carrinho do scanner e sincroniza com o sistema
        renderizarListaItens();
        sincronizarComJanelaPrincipal();

      } catch (errGeral) {
        console.error('[aoDetectarCodigo] Erro:', errGeral);
      }
    }

    // ─── RENDERIZAÇÃO VISUAL DA LISTA NO SCANNER ───
    function renderizarListaItens() {
      var container = document.getElementById('listaItensScaneados');
      var lblTitulo = document.getElementById('lblTituloLista');
      var btnTexto = document.getElementById('btnConcluirTexto');

      if (!container) return;

      var totalItens = ITENS_ESCANEADOS.length;
      var totalVolumes = 0;
      for (var j = 0; j < ITENS_ESCANEADOS.length; j++) {
        totalVolumes += (ITENS_ESCANEADOS[j].quantidadeNumero || 1);
      }

      if (lblTitulo) {
        lblTitulo.innerHTML = '<i class="material-icons tiny left" style="vertical-align: middle;">shopping_cart</i>' +
                              totalItens + ' item(ns) | ' + totalVolumes + ' vol.';
      }

      if (btnTexto) {
        btnTexto.innerText = totalItens > 0 ? ('ADICIONAR ' + totalItens + ' PRODUTO(S) AO AUTO') : 'CONCLUIR E VOLTAR';
      }

      if (totalItens === 0) {
        container.innerHTML = '<div style="text-align: center; color: #78909c; font-style: italic; padding: 22px 0; font-size: 0.84rem;">' +
                              'Aponte a câmera para os códigos de barra dos medicamentos apreendidos...</div>';
        return;
      }

      var html = '';
      for (var i = ITENS_ESCANEADOS.length - 1; i >= 0; i--) { // Mostra o mais recente no topo
        var it = ITENS_ESCANEADOS[i];
        var itemNome = it.produto || ('Produto ' + it.ean);
        var itemMarca = it.marca || '---';
        var itemVol = it.volume ? (' · ' + it.volume) : '';
        var qtd = it.quantidadeNumero || 1;

        html += '<div class="scanned-item-row">' +
          '<div class="scanned-item-info">' +
            '<div class="scanned-item-name">' + escaparHtml(itemNome) + '</div>' +
            '<div class="scanned-item-sub">' + escaparHtml(itemMarca) + escaparHtml(itemVol) + '</div>' +
          '</div>' +
          '<div class="scanned-item-ctrls">' +
            '<button type="button" class="btn-qty" onclick="alterarQuantidade(' + it.id + ', -1)">-</button>' +
            '<span class="item-qty-val">' + qtd + '</span>' +
            '<button type="button" class="btn-qty" onclick="alterarQuantidade(' + it.id + ', 1)">+</button>' +
            '<button type="button" class="btn-flat red-text text-lighten-2" style="padding: 0 4px; height: 28px; line-height: 28px; margin-left: 4px;" onclick="removerItem(' + it.id + ')">' +
              '<i class="material-icons tiny">delete</i>' +
            '</button>' +
          '</div>' +
        '</div>';
      }
      container.innerHTML = html;
    }

    function alterarQuantidade(idItem, delta) {
      for (var i = 0; i < ITENS_ESCANEADOS.length; i++) {
        if (ITENS_ESCANEADOS[i].id === idItem) {
          var novaQtd = (ITENS_ESCANEADOS[i].quantidadeNumero || 1) + delta;
          if (novaQtd <= 0) {
            ITENS_ESCANEADOS.splice(i, 1);
          } else {
            ITENS_ESCANEADOS[i].quantidadeNumero = novaQtd;
            ITENS_ESCANEADOS[i].quantidade = novaQtd + ' un';
          }
          break;
        }
      }
      renderizarListaItens();
      sincronizarComJanelaPrincipal();
    }

    function removerItem(idItem) {
      ITENS_ESCANEADOS = ITENS_ESCANEADOS.filter(function(x) { return x.id !== idItem; });
      renderizarListaItens();
      sincronizarComJanelaPrincipal();
    }

    function escaparHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ─── SINCRONIZAÇÃO EM TEMPO REAL COM A TELA DO AUTO ───
    function sincronizarComJanelaPrincipal() {
      var payload = {
        sistema: 'AMVS_DIGITAL',
        tipo: 'AMVS_PRODUTOS_ATUALIZADOS',
        itens: ITENS_ESCANEADOS,
        timestamp: Date.now()
      };

      // 1. PostMessage para o opener (Janela do Sistema AMVS / Iframe)
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, '*');
          if (window.opener.top && window.opener.top !== window.opener) {
            window.opener.top.postMessage(payload, '*');
          }
        }
      } catch(e) {}

      // 2. PostMessage para parent/top caso carregado embutido
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch(e) {}

      // 3. LocalStorage para sincronização resiliente entre abas do mesmo domínio
      try {
        localStorage.setItem('amvs_autos_itens_temp', JSON.stringify(payload));
      } catch(e) {}

      // 4. BroadcastChannel no mesmo domínio
      if (typeof BroadcastChannel !== 'undefined') {
        try {
          var bc = new BroadcastChannel('amvs_scanner_channel');
          bc.postMessage(payload);
          bc.close();
        } catch(e) {}
      }
    }

    // ─── CÂMERA AO VIVO ───
    function iniciarCamera() {
      html5QrCode = new Html5Qrcode("reader");
      var config = {
        fps: 15,
        qrbox: { width: 320, height: 160 },
        aspectRatio: 1.777778,
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true
        }
      };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        aoDetectarCodigo,
        function() {} // ignora frames sem código
      ).catch(function(err) {
        console.error("Erro câmera:", err);
        var msg = document.getElementById('msgListaVazia');
        if (msg) {
          msg.innerHTML = '<span style="color:#ff5252;">Acesso à câmera bloqueado. Permita a câmera nas configurações do navegador.</span>';
        }
      });
    }

    function alternarLanterna() {
      if (!html5QrCode) return;
      try {
        torchAtivo = !torchAtivo;
        html5QrCode.applyVideoConstraints({
          advanced: [{ torch: torchAtivo }]
        }).then(function() {
          var btn = document.getElementById('btnTorch');
          var icon = document.getElementById('iconTorch');
          if (torchAtivo) {
            btn.className = 'btn-floating btn-small amber darken-2 waves-effect';
            icon.innerText = 'flash_on';
          } else {
            btn.className = 'btn-floating btn-small grey darken-3 waves-effect';
            icon.innerText = 'flash_off';
          }
        }).catch(function() {
          torchAtivo = !torchAtivo;
        });
      } catch(e) {}
    }

    function concluirEFechar() {
      sincronizarComJanelaPrincipal();
      try {
        if (html5QrCode) {
          html5QrCode.stop().then(function() { window.close(); }).catch(function() { window.close(); });
        } else {
          window.close();
        }
      } catch(e) {
        window.close();
      }
      // Se window.close for bloqueado pelo navegador em mobile tab
      setTimeout(function() {
        var btn = document.getElementById('btnConcluirTexto');
        if (btn) btn.innerText = '✔ ITENS SALVOS! FECHE ESTA ABA';
      }, 350);
    }

    window.addEventListener('DOMContentLoaded', function() {
      carregarBaseCmedLocal();
      iniciarCamera();
    });
  </script>
</body>
</html>
